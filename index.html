<style>

*{box-sizing:border-box}

.band .wrap{padding-block:28px 26px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}

.btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:15px}

.story h2{font-family:var(--display);font-size:clamp(26px,4vw,34px);margin:2px 0 4px;line-height:1.15}
.story .route{margin-bottom:18px}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;min-width:0}

.chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border:1.5px dashed var(--gold);color:var(--gold);background:var(--gold-soft);padding:3px 9px;border-radius:4px}

.choice{text-align:left;background:var(--teal-soft);color:var(--ink);border:1.5px solid var(--teal);border-radius:8px;padding:12px 16px;font-size:16.5px;font-weight:600;display:flex;gap:10px}
.choice::before{content:"→";color:var(--teal)}
.choice:hover{background:var(--teal);color:var(--surface)}
.choice:hover::before{color:var(--surface)}
.ending{border-top:1px solid var(--line);margin-top:6px;padding-top:16px}

.stamp.good{color:var(--good)} .stamp.mixed{color:var(--mixed)} .stamp.hard{color:var(--hard)}
.ending h3{font-family:var(--display);font-size:24px;margin:0 0 8px}

.panel h4{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.track{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.track li{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted)}
.track li.lit{color:var(--ink);font-weight:600}

.track li.lit b{background:var(--gold-soft);color:var(--gold)}
.terms{display:grid;gap:12px}
.terms h5{font-family:var(--display);font-size:16px;margin:0 0 4px;color:var(--teal)}
.terms dl{margin:0;display:grid;gap:6px}
.terms dt{font-weight:700;font-size:14.5px}
.terms dd{margin:0 0 2px;font-size:14px;color:var(--muted);line-height:1.4}
.log{margin:0;padding-left:20px;font-size:14.5px;color:var(--muted);display:grid;gap:4px}
.small{font-size:14px;color:var(--muted);margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

<header class="band"><div class="wrap">
  <div>
    <div class="eyebrow">AP Human Geography · Migration</div>
    <h1>The Immigrant Experience: What Would You Do?</h1>
    <p>Pick an immigrant, make their choices, and use what happens to them as evidence on your worksheet.</p>
  </div>
</div></header>

<script>
const TAGS=[["push","Push factor"],["pull","Pull factor"],["opp","Intervening opportunity"],["obs","Intervening obstacle"],["forced","Forced migration clue"],["vol","Voluntary migration clue"],["pol","Government response"]];
const TAGNAME=Object.fromEntries(TAGS);

const STORIES=[
{id:"juan",name:"Juan Morales Ortiz",from:"Michoacán, Mexico",to:"Mexico City, Texas, California or Chicago",year:"1952",blurb:"A farmer's son can earn more in one harvest up north than in a year at home.",start:"start",nodes:{
start:{t:"San Lucas, Michoacán, Mexico, spring 1952. You are 19, the oldest of six kids. Your father hurt his back last year and can barely work the family's small plot of ejido land, which is shared village land the government gave to farmers. The corn harvest was thin, and your family owes money to a moneylender who charges interest every month.\n\nLast year your neighbor Rafael went north as a bracero. The U.S. and Mexican governments created the Bracero Program in 1942 so Mexican men could work on American farms with short, legal contracts. Rafael came home with enough money to put a tin roof on his house. He says a bracero can earn in a few months what you make here in a year.\n\nYour mother doesn't want you to go. Your father says the family can't survive another bad year.",c:[["Go to the bracero recruitment center in Irapuato","recruit"],["Cross the border without papers. It's faster than waiting for a contract","cross"],["Move to Mexico City, where factories are hiring","mexcity"]]},
recruit:{t:"The recruitment center in Irapuato is a mess. Thousands of men sleep in the plaza, waiting for their names to be called. Each town gets only a few spots, and the town officials decide who goes.\n\nA man in a nice hat pulls you aside. For 200 pesos, he says, he can put your name near the top of the list. That's more than your family earns in a month. Other men say the officials are all in on it. A few say they've waited honestly and been picked.",c:[["Borrow the 200 pesos from the moneylender and pay the bribe","bribe"],["Refuse to pay and wait your turn","waitline"]]},
bribe:{t:"The moneylender gives you the cash, but now your family's debt is bigger, and it keeps growing every month you're gone. Two days later your name is called.\n\nYou ride a crowded train north to a reception center on the Texas border. American inspectors line you up and look at your hands. Rough hands with calluses mean you're a real farmworker. Soft hands mean you're sent home. Then they make you strip, and men in masks spray you with DDT, a pesticide, to kill lice. It burns your eyes.\n\nA clerk reads a contract in English that you can't understand and points to where you should sign. Two kinds of jobs are open today.",c:[["Sign for cotton picking in West Texas, close to home","texas"],["Sign for lettuce harvesting in California, farther but better paid","calif"]]},
waitline:{t:"You wait. A week passes, then two. Your money runs out and you sleep on newspapers in the plaza. You eat one meal a day at a church. Some men give up and walk north to cross the river on their own.\n\nAfter 19 days a clerk finally calls your name. The men who paid bribes left two weeks ago.\n\nYou ride a crowded train north to the reception center on the Texas border. Inspectors check your hands for calluses, then spray you with the pesticide DDT. A clerk points to where you should sign a contract written in English.",c:[["Sign for cotton picking in West Texas","texas"],["Sign for lettuce harvesting in California","calif"],["Give up on the program and cross the river on your own","cross"]]},
texas:{t:"The cotton farm outside Lubbock is huge and flat. Your contract promises fair wages and decent housing. Instead, 40 men sleep in a converted barn, and the company takes money out of your pay for meals of beans and tortillas.\n\nYou're paid by the pound of cotton you pick. After a week, you and the other men are sure the farm's scale is rigged. Your sacks feel heavier than the numbers say.\n\nEarly in the program, the Mexican government refused to send braceros to Texas for several years because of discrimination against Mexican workers there. Things are supposed to be better now.",c:[["Report the rigged scale to the Mexican consulate","consul"],["Convince the other men to stop working until the scale is fixed","stoppage"],["Keep quiet and keep picking","season"]]},
consul:{t:"You walk 12 miles to town and tell an official at the Mexican consulate about the scale. Under the program's rules, consulates can investigate complaints. A week later an inspector visits, and the scale is fixed.\n\nBut the foreman now knows your name. He gives you the worst rows, the ones with thin cotton, so you earn less anyway. An older bracero tells you men who complain usually don't get picked for a second contract.",c:[["Finish the season anyway","season"],["Walk off the job and look for work on your own","skipped"]]},
stoppage:{t:"Thirty men sit down in the field and refuse to pick. By noon the farm owner has called immigration officials. Braceros who cause trouble can have their contracts canceled and be sent home, and that's what happens to you and two others.\n\nYou're put on a bus back to the border with three weeks' pay. That's not even enough to repay the moneylender.\n\nBack home, your father doesn't say anything. He doesn't have to.",c:[["Wait for next year and try the recruitment center again","recruit"],["Cross the river without papers and find work on your own","cross"]]},
calif:{t:"The lettuce fields of the Salinas Valley stretch to the mountains. You work bent over all day with a short-handled hoe, which is only about 18 inches long. Growers say it makes workers more careful. Your back says otherwise. Decades later, California will ban the tool for causing injuries.\n\nThe camp is better than you expected: bunk beds, showers, and a cook from Jalisco. A man from a farmworkers' union visits at night and asks braceros about their conditions. He says growers use braceros to keep wages low for everyone. Meanwhile, a rancher down the road offers cash wages higher than your contract if you'll leave and work for him.",c:[["Tell the union man about your working conditions","union"],["Keep your head down and finish the contract","season"],["Leave your contract and work for the rancher","skipped"]]},
union:{t:"You tell the union man about the hoe, the pay deductions, and the foreman who yells at you. He writes it all down. In the 1950s, researchers and union organizers collect hundreds of stories like yours, and they become part of the argument that eventually ends the Bracero Program.\n\nNothing changes for you this season. But one of the other braceros warns you that the foreman saw you talking.",c:[["Finish the contract and go home","season"],["Leave before the foreman reports you","skipped"]]},
season:{t:"The harvest ends and so does your contract. You ride home with more money than you've ever held: enough to pay off the moneylender, fix the roof, buy a cow, and get school shoes for your sisters.\n\nThe whole village comes to see what you brought. Two of your cousins ask if you'll help them go north too.\n\nYour father can't work the land alone. Your mother asks you to stay. The recruiters will be back next spring.",c:[["Go north again every season and come home in between","endCircular"],["Use the savings to open a small store in the village","endStore"],["Next year, stay in the U.S. after your contract ends","skipped"]]},
skipped:{t:"You're now in the U.S. without permission. Workers like you are called “skips.” Farmers will still hire you, but for less money, and you can't complain about anything because they could call the Border Patrol.\n\nA cousin writes from Chicago. He says the steel mills in South Chicago have hired Mexican workers since the 1910s, there's a Mexican church, and nobody checks papers too closely.",c:[["Stay and work on farms in the Southwest","sweep"],["Ride the rails to Chicago","chicago"]]},
cross:{t:"At night you wade across the Rio Grande near Reynosa. The water is chest-deep and cold. On the Texas side, a farmer hires you without papers and pays you half what a bracero earns.\n\nIn 1954, the U.S. government is under pressure to stop illegal immigration. Your boss tells you something strange: sometimes officials drive workers like you to the border, have them step into Mexico, and bring them right back as legal braceros. People call it being “dried out.” He offers to do it for you.",c:[["Accept and get “dried out” into the Bracero Program","dried"],["Stay with the farmer without papers","sweep"],["Ride the rails to Chicago","chicago"]]},
dried:{t:"It's true. A Border Patrol truck drives you and five other men to the bridge. You step onto Mexican soil for about ten minutes, sign some papers, and walk back as a contracted bracero for the same farmer, with the same work but legal now.\n\nIt makes you think about who the border is really for.",c:[["Finish the contract and go home","season"],["Stay after this contract ends","skipped"]]},
sweep:{t:"In the summer of 1954, the U.S. government launches a huge deportation campaign that it officially calls “Operation Wetback,” using a slur against Mexican immigrants. Agents raid farms, ranches, and neighborhoods across the Southwest. They report more than a million arrests and returns, though historians think that number is inflated.\n\nThey catch you at dawn in a bunkhouse. You're put on a crowded bus and driven deep into central Mexico so it will be hard for you to come back.",c:[["Try the bracero recruitment center the legal way","recruit"],["Go home to San Lucas for good","endDeported"]]},
chicago:{t:"Chicago is bigger, colder, and louder than anything you imagined. Your cousin gets you a job at a steel mill in South Chicago, shoveling near the furnaces. It's dangerous, but it pays almost three times what a bracero earns.\n\nYou go to Mass at Our Lady of Guadalupe, a church Mexican steelworkers built in the 1920s. You meet men from Michoacán, Jalisco, and Guanajuato who all came the same way you did.\n\nIn winter, the snow piles up to your knees.",c:[["Stay and send for your family","endChicago"],["Go home with your savings","endStore"]]},
mexcity:{t:"Mexico City is growing fast as millions of people leave the countryside for city jobs. You find a room in a colonia on the edge of the city, where people build their own houses out of cinder blocks one wall at a time.\n\nYou get a job at a textile mill. The pay is better than farming, but rent and bus fare eat most of it. Your family wants you to send money home, and you can't send much.\n\nThen your old neighbor Rafael writes. He's going north again as a bracero and says he can introduce you to the right officials.",c:[["Stay in the city and work your way up","endMexCity"],["Go north as a bracero with Rafael","recruit"]]},
endCircular:{t:"For the next ten years, you go north every spring and come home every fall. You know the recruiters, the foremen, and the best camps. You help both cousins get contracts.\n\nWhen the Bracero Program ends in 1964, your family has a brick house, and your youngest sister is the first in the family to finish secondary school. Your life has been split between two countries, but your home never moved.",e:{k:"good",h:"North and back"}},
endStore:{t:"You never go north again. Your little store sells sodas, rice, and soap, and it has the village's first telephone. Neighbors come to call relatives working in the U.S.\n\nMoney from one or two seasons up north changed your family's future. Your little brother will probably go north someday too.",e:{k:"good",h:"Home with a plan"}},
endChicago:{t:"You send for your wife and children, and your family becomes part of Chicago's growing Mexican community. Your kids grow up speaking English at school and Spanish at home.\n\nWithout papers, you always worry about deportation. Decades later, a 1986 law offers legal status to millions of long-time undocumented immigrants, and you finally become a legal resident.",e:{k:"mixed",h:"South Chicago"}},
endDeported:{t:"You return to San Lucas with nothing to show for your time up north. The moneylender still wants his money, and your family has to sell the cow.\n\nYou help your father in the fields and wonder whether you should have stayed in line in Irapuato.",e:{k:"hard",h:"Sent back"}},
endMexCity:{t:"After eight years you're a supervisor at the textile mill. You marry, and your kids grow up as city kids who visit the village at Christmas.\n\nYou never crossed a border, but you made one of the biggest moves of the century. Millions of Mexicans moved from farms to cities in these years.",e:{k:"good",h:"Into the capital"}}
}},
{id:"minh",name:"Trần Văn Minh",from:"Saigon, Vietnam",to:"Malaysia, Thailand, then the USA, Australia or Germany",year:"1979",blurb:"A 17-year-old's family has lost everything since the war ended.",start:"start",nodes:{
start:{t:"Ho Chi Minh City, Vietnam, early 1979. The city used to be called Saigon. Since North Vietnam won the war in 1975, your father has been held in a “re-education camp” in the north because he was an officer in the South Vietnamese army. You've seen him once in four years.\n\nLast year the government took over private businesses, including your family's bicycle repair shop. Your mother now sells noodle soup on the sidewalk. Vietnam has invaded Cambodia, and you just turned 17. Boys your age are being drafted.\n\nYour mother has six taels of gold (about eight ounces) sewn into a pillow. A seat on a secret boat costs about three taels a person.",c:[["Spend the gold on boat seats for you and your little sister Lan","boat1"],["Ask your aunt in California to sponsor you through a new legal-exit program","odp"],["Go alone over land through Cambodia to Thailand, which costs less gold","overland"]]},
odp:{t:"In 1979 Vietnam agrees with the UN to start the Orderly Departure Program, which lets some people leave legally to join family overseas. Your aunt in California files papers for you.\n\nBut applying is risky. The ward police now know your family wants to leave. A month later, your mother's permit to sell soup is canceled. Neighbors stop talking to you.\n\nThe paperwork moves slowly. Then, before your exit papers arrive, your draft notice does.",c:[["Report for the army and keep your exit application open","endArmy"],["Hide from the draft and take a boat after all","boat1"]]},
overland:{t:"A guide leads you and eight others into Cambodia. The country is wrecked. The Khmer Rouge government killed more than a million people before Vietnam invaded, and the countryside is full of landmines. You walk at night and hide during the day.\n\nIn the third week, soldiers stop your group. They take everyone's gold, watches, and shoes. The guide disappears.\n\nYou are barefoot, broke, and about two weeks from the Thai border.",c:[["Keep walking toward Thailand","thai"],["Turn back. You'll get home somehow and try another way","boatPoor"]]},
boatPoor:{t:"It takes you a month to get back to Saigon. Your mother cries when she sees you. She sells her wedding ring and her sewing machine, which is enough for one seat on a boat, for you only. Lan will have to stay.\n\nYou leave without saying goodbye to your sister because she's asleep.",c:[["Get on the boat","boat1"],["Stay with your family and apply legally instead","odp"]]},
thai:{t:"You reach the border, where hundreds of thousands of Cambodians and Vietnamese are living in camps. Thailand didn't sign the UN Refugee Convention and doesn't want them. In June 1979, Thai soldiers forced tens of thousands of Cambodians back across the border down a mountainside covered in landmines.\n\nYou slip into a camp run by the UN refugee agency, UNHCR. You're given a number, a plastic sheet for shelter, and a rice ration. Another Vietnamese teen says you could get a job in Bangkok if you can get past the guards.",c:[["Register with UNHCR and wait for an interview","interview"],["Slip out and look for work in Bangkok","bangkok"]]},
bangkok:{t:"You make it to Bangkok and find work washing dishes. Three weeks later, police raid the restaurant. Without papers, you're an illegal immigrant in Thailand, and you're locked in a crowded immigration jail with men from six countries.\n\nAfter four months, UNHCR staff find you and get you moved back to a camp. You've lost time, and your file has been moved to the bottom of the pile.\n\nA French aid worker says France sometimes takes refugees who speak some French. Your father taught you a little.",c:[["Wait for the U.S. interview","interview"],["Apply to go to France","endFrance"]]},
boat1:{t:"You leave from a river mouth in the Mekong Delta at 2 a.m. The fishing boat is 18 meters long and packed with 120 people in the hold. You can't sit up straight.\n\nAt dawn, before you've reached open sea, a government patrol boat pulls alongside. An officer shouts that everyone is under arrest unless the boat “pays the fee.” The captain begs passengers to hand over any gold they have left.\n\nYou have a little gold sewn into your waistband. It's all the money you'll have when you land.",c:[["Give the patrol your gold","sea"],["Keep your gold hidden and hope others pay enough","seaGold"],["Jump overboard and swim back to shore","caught"]]},
caught:{t:"You swim to shore and get caught by police within an hour. You spend six months in a labor camp, digging irrigation ditches. When you're released, you've lost your seat, your gold, and half a year.\n\nYour mother has heard the boat you left made it to Malaysia.",c:[["Try again on another boat","boatPoor"],["Apply to leave legally through your aunt","odp"]]},
sea:{t:"The patrol boat leaves and your boat heads into the South China Sea. On the second night a storm hits. Waves crash over the sides and people scream in the dark. You bail water with a cooking pot for six hours.\n\nBy morning the engine is dead and the drinking water is almost gone. A cargo ship passes in the distance. Then, from the other direction, a Thai fishing boat speeds toward you. Pirates attack refugee boats like yours, robbing and kidnapping passengers.",c:[["Signal the cargo ship and hope it stops","freighter"],["Help the men prepare to fight off the pirates","pirates"]]},
seaGold:{t:"Other passengers pay, and the patrol boat leaves. Your gold is still hidden. But on the second night, a storm hits and the engine dies. By morning the drinking water is almost gone.\n\nA Thai fishing boat full of armed men pulls up. Pirates attack refugee boats like yours, robbing and kidnapping passengers. They search everyone and find the gold in your waistband.",c:[["Hand it over without fighting","pirates"],["Signal a cargo ship on the horizon","freighter"]]},
pirates:{t:"The pirates take every piece of gold, every watch, and the boat's compass. They smash what's left of the engine and leave. It is terrifying, but everyone on your boat is still alive. Not every boat is so lucky.\n\nThe men rig a sail from tarps. The current pushes you toward Malaysia. On the fifth day, you see land.",c:[["Steer for the Malaysian coast","malaysia"],["Keep waving at passing ships for rescue","freighter"]]},
freighter:{t:"Three ships pass without stopping. Their captains worry that if they pick up refugees, no country will let them unload them. Then, near sunset, a white ship turns toward you.\n\nIt's the Cap Anamur, a ship sent by West German volunteers to rescue Vietnamese boat people. Sailors pull everyone aboard, give you water and rice, and treat the sick. The doctor says West Germany has agreed to take in the people this ship rescues.",c:[["Accept West Germany's offer","endGermany"],["Ask to be dropped at a camp so you can apply to the U.S., where your aunt is","malaysia"]]},
malaysia:{t:"You reach Malaysia's coast, but Malaysia's camps are overflowing, and in 1979 its navy tows tens of thousands of refugees back out to sea. A patrol boat ties a rope to your bow and starts pulling you away from the beach.\n\nAn older man whispers a plan. If the boat is wrecked, the navy can't tow it away. Some refugees have been sinking their own boats near shore to force the authorities to let them land.",c:[["Help sink the boat so you can't be towed away","bidong"],["Cut the rope and sail for Indonesia","indonesia"]]},
bidong:{t:"You pull boards out of the hull, and the boat begins to sink. The navy has no choice but to bring you ashore. You're taken to Pulau Bidong, a small island where about 40,000 refugees are squeezed into a space less than one square kilometer.\n\nFresh water comes by boat and is rationed. You sleep under plastic sheeting. You volunteer to teach younger kids English using a battered textbook.\n\nOfficials from different countries come to interview refugees.",c:[["Apply to the United States, where your aunt lives","interview"],["Apply to Australia, which is processing cases faster","australia"]]},
indonesia:{t:"Three more days at sea bring you to Indonesia. You're taken to Galang, an island where the UN is building a large refugee camp with a clinic, a school, and English classes. It's still crowded, but it's organized and safe.\n\nYou sleep without fear for the first time in weeks. Officials from different countries come to interview refugees.",c:[["Apply to the United States, where your aunt lives","interview"],["Apply to Australia, which is processing cases faster","australia"]]},
australia:{t:"An Australian officer interviews you. Australia recently ended its “White Australia” policy, which kept out most non-European immigrants, and is now taking tens of thousands of Vietnamese refugees.\n\nYou're approved in three weeks. But your aunt in California writes that she has a bedroom ready for you and a cousin who can get you a job.",c:[["Accept Australia's offer","endAustralia"],["Hold out for the U.S. so you can be with family","interview"]]},
interview:{t:"In July 1979, at a conference in Geneva, Western countries agree to resettle many more refugees from Southeast Asia. In 1980 the U.S. passes the Refugee Act. An American officer interviews you through a translator about your father, the army, and the re-education camp. You're approved as a refugee.\n\nNow you must choose where to go. A refugee agency explains the options.",c:[["Join your aunt and cousins in Orange County, California","endLittleSaigon"],["Accept a church family's sponsorship in a small town in Iowa","endIowa"],["Go to the Texas coast, where Vietnamese fishermen are working on shrimp boats","endGulf"]]},
endArmy:{t:"You serve two years in Cambodia. You come home thinner and quieter. In 1983 your exit papers finally come through, and in 1984 you fly to San Francisco, legally and safely, with your mother and Lan.\n\nYou left the slow way. It cost years, but your whole family made it together.",e:{k:"mixed",h:"The long way out"}},
endFrance:{t:"France accepts you. You fly to Paris, where a Vietnamese community has existed since the colonial era. You live in a hostel for refugees, learn French in six months, and train as an electrician.",e:{k:"good",h:"Paris"}},
endGermany:{t:"West Germany flies you to Hamburg. You learn German, train as a machinist, and help start one of the first Vietnamese community associations in the city. Years later you sponsor Lan to join you.",e:{k:"good",h:"Rescued at sea"}},
endAustralia:{t:"You land in Sydney. You share a house with other refugees in a western suburb and work in a factory while finishing high school at night. Your neighborhood will later fill with Vietnamese bakeries, shops, and restaurants.",e:{k:"good",h:"Sydney"}},
endLittleSaigon:{t:"Orange County is becoming “Little Saigon,” with Vietnamese shops, newspapers, and churches. You work in your aunt's bakery and study engineering at night. Years later, you sponsor your mother and Lan to join you.\n\nYour family is now one link in a chain that keeps growing.",e:{k:"good",h:"Little Saigon"}},
endIowa:{t:"Iowa's governor publicly invited Southeast Asian refugees to settle in the state. A Lutheran church family meets you at the airport with a winter coat. You're the only Vietnamese kid at your high school.\n\nIt's lonely at first, but you graduate with honors and the church family comes to your graduation.",e:{k:"good",h:"Snow in Iowa"}},
endGulf:{t:"You and your cousins buy a used shrimp boat. Some local fishermen resent the competition. In 1981 the Ku Klux Klan holds a rally and burns a boat to scare Vietnamese fishermen off Galveston Bay.\n\nThe Vietnamese fishermen go to court, and a federal judge orders the Klan to stop. You keep fishing, but you never feel completely safe.",e:{k:"mixed",h:"Trouble on the bay"}}
}},
{id:"ousmane",name:"Ousmane Diallo",from:"Thiaroye-sur-Mer, Senegal",to:"Mauritania, Libya, Italy or Spain",year:"2006",blurb:"A fisherman's nets keep coming up emptier every year.",start:"start",nodes:{
start:{t:"Thiaroye-sur-Mer, Senegal, 2006. You're 22. Your father and grandfather fished from wooden canoes called pirogues. Now big foreign trawlers, many fishing under deals your government signed with the European Union and other countries, catch huge amounts of fish offshore. Your catches shrink every year, and the price of fuel keeps climbing.\n\nYour friend Moussa's brother works in Spain and sends home enough euros to support his whole family. Spain's farms and construction sites need workers. The Canary Islands, which belong to Spain, are about a week away by pirogue.\n\nYour mother and uncles have pooled their savings. It's enough for one seat on a boat, or for a few months in the city.",c:[["Buy a seat on a pirogue to the Canary Islands","pirogueStart"],["Move to the capital, Dakar, and look for work first","dakar"],["Travel over land across the Sahara toward Libya","sahara"]]},
pirogueStart:{t:"At midnight you wade out to a fishing boat on a beach near Mbour. The captain is a fisherman who knows the sea, and he has a GPS. The organizer took your money last week.\n\nMore people keep climbing in. The boat was supposed to hold 60. You count more than 90. The captain says the boat is too low in the water and asks for ten people to wait for the next trip.\n\nIf you get out, you might not get your money back.",c:[["Stay in the boat","atlantic"],["Get out and wait for the next boat","waitBoat"]]},
waitBoat:{t:"You wade back to shore. Two days later, police raid the beach. Senegal has started patrolling its coast with help from Spain, and the organizer disappears with your money.\n\nYour family's savings are gone. Your mother says nothing. Your uncle says you owe him.",c:[["Go to Dakar and earn the money back","dakar"],["Borrow from a cousin and try another boat","atlantic"]]},
atlantic:{t:"The open Atlantic is nothing like fishing near shore. Waves lift the boat high, then drop it. People vomit and shiver in wet clothes. You ration water by the capful.\n\nOn day five, the motor coughs and dies. The captain says it can be fixed, but it might take a day, and meanwhile the current is pushing you south, away from the islands.\n\nMore than 30,000 people reach the Canary Islands by boat in 2006. Thousands more die trying.",c:[["Help the captain fix the motor","canaries"],["Vote to drift back toward the African coast","endTurnBack"]]},
canaries:{t:"You fix the motor and limp toward the islands. A Spanish coast guard boat tows your pirogue into port in Tenerife. Red Cross volunteers hand out blankets and water. Then police take you to a detention center.\n\nSpain and Senegal have just signed an agreement to send Senegalese migrants back, and charter flights to Dakar are leaving every week. Spain can only send you back if it knows your nationality. Some men in the center refuse to say where they're from. Spanish law allows only 40 days of detention, and after that anyone who can't be deported gets released.",c:[["Tell officials the truth: you're Senegalese","repatriated"],["Refuse to answer questions about where you're from","mainland"]]},
repatriated:{t:"Two weeks later you're on a plane to Dakar with 50 other men. Spanish officials give each of you a small amount of cash. At the airport, Senegalese police take your name.\n\nYou're home, alive, and in debt. Neighbors look at you with pity. A government office in Dakar is taking applications for legal farm jobs in Spain.",c:[["Apply for a legal work contract","contract"],["Stay in Dakar and find work","dakar"]]},
mainland:{t:"After 40 days, officials put you on a plane to Madrid. You're released with a paper ordering you to leave Spain. A charity gives you a train ticket and a phone number.\n\nThe number belongs to a man from your town who lives in Almería, where tens of thousands of migrants work in vegetable greenhouses. Another friend texts from Barcelona. He sells handbags on the street and says the money is good if you can dodge the police.",c:[["Go to the greenhouses in Almería","almeria"],["Go to Barcelona and sell goods on the street","bcn"]]},
almeria:{t:"Almería's “sea of plastic” is thousands of greenhouses covering the land. Inside it's often over 40°C (104°F). You pick tomatoes and peppers for about 30 euros a day, paid in cash, with no contract.\n\nIn 2000, riots broke out in the nearby town of El Ejido after a local woman was killed by a migrant, and mobs attacked North African workers' homes. Some locals still don't want you here.\n\nSpanish law has a rule called arraigo: if you live in Spain for three years and get a job offer, you can apply for legal residence. Three years is a long time.",c:[["Stay and work toward three years","endArraigo"],["Report your boss to labor inspectors for unpaid wages","inspect"]]},
inspect:{t:"Your boss owes you two weeks' pay. You go to a migrant rights group, and they help you file a complaint. Inspectors visit the greenhouse.\n\nYou get your money. You also lose your job, and other growers hear about it. It takes you two months to find work again.",c:[["Keep going toward three years","endArraigo"],["Move to Barcelona","bcn"]]},
bcn:{t:"In Barcelona you lay out a white sheet on the sidewalk and sell fake designer bags to tourists. You and the other street vendors, called manteros, watch for police. When they come, you pull the corners of the sheet together and run.\n\nSome days you make 80 euros. Other days police take all your goods, and you owe the supplier.",c:[["Keep selling","endManteros"],["Move to the greenhouses in Almería","almeria"]]},
dakar:{t:"Dakar is crowded and expensive. You sell phone credit on a street corner and sleep on your uncle's floor. You save a little each week.\n\nThree paths open up. Spain and Senegal have agreed to hire some Senegalese workers legally for seasonal farm jobs, but there are only a few hundred spots. A friend is heading north to Nouadhibou, Mauritania, where fish plants are hiring and boats leave for Spain. And a pirogue organizer is recruiting on your street.",c:[["Apply for a legal work contract in Spain","contract"],["Go north to Nouadhibou, Mauritania","mauri"],["Try the pirogue again","pirogueStart"]]},
contract:{t:"Thousands of men apply. You go through three interviews and a medical exam. You're chosen.\n\nYou fly to Spain on a temporary work visa to pick fruit. The pay is legal, the housing is clean, and your boss is fair. The deal is that you must go home when the season ends, or you'll never be chosen again.\n\nWhen the season ends, a farmer offers you cash work for the winter if you stay.",c:[["Go home as agreed","endGuest"],["Stay in Spain after your visa runs out","almeria"]]},
mauri:{t:"Nouadhibou is a dusty port at the edge of the Sahara. The fish-processing plants hire West Africans to gut and freeze fish for export, possibly the same fish that used to swim off your village.\n\nSpain pays Mauritania to patrol its coast. Police sometimes round up migrants, put them in trucks, and leave them at the border with Senegal or Mali. A boat to the Canaries leaves from here next week.",c:[["Work in the fish plant","endMauri"],["Take the boat from here","atlantic"]]},
sahara:{t:"You ride buses through Mali, then trucks across Niger. At every checkpoint, police or soldiers demand money. In Agadez, the desert's migration hub, drivers pack 30 people onto the back of a pickup for the trip to Libya.\n\nOn the third day, the driver stops in the middle of the desert and says he needs more money or he'll leave everyone there. Most people pay. Two men who can't are left behind with a jug of water.",c:[["Pay the driver and continue to Libya","libya"],["Get off with the two men and walk back toward Agadez","endDesert"]]},
libya:{t:"Libya is rich from oil, and its leader, Muammar Gaddafi, lets many African workers in. You find construction work in Tripoli. But police raid neighborhoods and lock migrants in detention centers. Italy is paying Libya to stop boats from leaving for Europe.\n\nSmugglers on the beach say a boat to the Italian island of Lampedusa leaves Thursday.",c:[["Stay and work in Libya","endLibya"],["Take the boat to Lampedusa","lampedusa"]]},
lampedusa:{t:"After a terrifying night at sea, your boat reaches Lampedusa, a tiny Italian island closer to Africa than to Rome. You're held in a reception center, fingerprinted, and moved to mainland Italy. Officials give you a paper saying you must leave the country within five days.\n\nYou know people in two places: a friend picking tomatoes in southern Italy and a cousin in Spain.",c:[["Pick tomatoes in southern Italy","endItaly"],["Travel to Spain to join your cousin","mainland"]]},
endTurnBack:{t:"The boat drifts for two days before a Senegalese fishing boat finds you and tows you home. You're broke, sunburned, and lucky to be alive. Your mother holds you and doesn't let go.",e:{k:"hard",h:"Back to shore"}},
endArraigo:{t:"Three years of greenhouse work, rent receipts, and bus tickets prove you've lived in Spain. A farmer gives you a written job offer. You apply under arraigo and get legal residence.\n\nFor the first time in years, you fly home to Senegal and then fly back to Spain legally. Your money now builds a house in Thiaroye.",e:{k:"good",h:"Papers after three years"}},
endManteros:{t:"You sell on the streets for years. You send money home, but you live in fear of fines and deportation. In 2015 Barcelona's street vendors form a union to demand legal status. You join.",e:{k:"mixed",h:"The mantero union"}},
endGuest:{t:"You go home as agreed with more money than a year of fishing would bring. You buy a new motor for your family's boat and get married. You hope to be chosen again next year.",e:{k:"good",h:"With a contract in hand"}},
endMauri:{t:"The fish plant pays poorly, but it's steady. You send money home every month and never board a boat. Your migration took you one country north.",e:{k:"mixed",h:"One country north"}},
endDesert:{t:"It takes three days to walk back to Agadez. One of the men nearly dies of thirst. You take a bus home with what little money you have left. You'll never forget the desert.",e:{k:"hard",h:"Turned back in the Sahara"}},
endLibya:{t:"You work as a painter in Tripoli for four years. When civil war breaks out in Libya in 2011, foreign workers are trapped in the fighting. You're evacuated home on a flight organized by the International Organization for Migration, with only the clothes you're wearing.",e:{k:"hard",h:"Caught in a war"}},
endItaly:{t:"You live in a shack with other workers and pick tomatoes for a few euros a crate, paid in cash by a middleman who takes a cut. You send money home, but without papers you have no protection.",e:{k:"mixed",h:"Tomato season"}}
}},
{id:"batbayar",name:"Batbayar Dorj",from:"Arkhangai, Mongolia",to:"Within Mongolia, or South Korea",year:"2009",blurb:"A herding family moves with the seasons until one winter changes everything.",start:"start",nodes:{
start:{t:"Arkhangai Province, Mongolia, autumn 2009. You're 19, the oldest son in a herding family. Every spring your family packs its two gers (round felt tents) onto a truck and moves 300 sheep, goats, horses, and yaks to summer pasture by the Tamir River. Every autumn you move back to a winter camp sheltered by the hills. The animals need fresh grass, so your family moves with them, the same way your grandparents did.\n\nThis summer was very dry. The grass is thin, and the animals are not as fat as they should be going into winter. Older herders are worried about a dzud, a disaster winter.\n\nYou could sell 30 goats to buy hay. Or you could take the herd on an otor, a long emergency move to find better grass.",c:[["Sell 30 goats and buy hay","dzudHay"],["Take the herd on an otor to a neighboring province","otor"],["Keep all the animals and the money and hope winter is mild","dzud"]]},
otor:{t:"You and your uncle drive the herd 200 kilometers east, sleeping in a small tent. The grass is better there, but you're not the only family that had the idea. Local herders are angry that outsiders are eating their pasture, and the district governor orders newcomers to move on.\n\nThen the snow comes early. Winter brings a dzud: deep snow and temperatures below −40°. By spring, about 8 million animals have died across Mongolia. Your herd survives better than most, but you still lose almost half.",c:[["Stay and rebuild the herd","rebuild"],["Move the family to Ulaanbaatar, the capital","ub"],["Join your cousin at a new mine in the Gobi Desert","mine"]]},
dzudHay:{t:"The hay costs more than you expected. Prices have shot up because every family is buying.\n\nWinter brings a dzud: deep snow and temperatures below −40°. By spring, about 8 million animals have died across Mongolia. Your hay saves many of yours, but you still lose a third of the herd, and all your savings are gone.",c:[["Stay and rebuild the herd","rebuild"],["Move the family to Ulaanbaatar, the capital","ub"],["Join your cousin at a new mine in the Gobi Desert","mine"]]},
dzud:{t:"Winter brings a dzud: deep snow and temperatures below −40°. The animals can't dig through the ice to reach the grass. Every morning you drag frozen carcasses away from the pens. By spring, about 8 million animals have died across Mongolia, roughly one out of every five in the country.\n\nYour family loses two-thirds of its herd. Without animals, a herding family has no income and nothing to eat or sell.",c:[["Stay and rebuild the herd","rebuild"],["Move the family to Ulaanbaatar, the capital","ub"],["Join your cousin at a new mine in the Gobi Desert","mine"]]},
rebuild:{t:"The government and aid groups give some families replacement animals. A program offers herders livestock insurance that pays out if many animals die in a district. Neighbors are forming a cooperative to share pasture and store hay together.\n\nBut it will take years to rebuild, and your two younger sisters need to go to school in the district center. Many herding families split up: the mother lives in town with the kids during the school year, and the father and sons stay with the herd.",c:[["Join the cooperative and split the family between town and pasture","endHerd"],["Sell the remaining animals and move everyone to the province's main town","aimag"]]},
aimag:{t:"Tsetserleg, the provincial capital, has a few thousand people, a hospital, and good schools. You rent a small apartment with heat and running water, which feels like luxury. You get a job loading trucks at a warehouse.\n\nBut the pay is low, and your father doesn't know what to do without animals. Cousins in Ulaanbaatar say the capital has more jobs.",c:[["Stay in Tsetserleg","endAimag"],["Keep going to Ulaanbaatar","ub"]]},
ub:{t:"You load the ger onto a truck and drive 400 kilometers to Ulaanbaatar. You set it up in a ger district, a huge spread of tents and wooden houses on the hills at the city's edge. There's no running water. You buy water from a kiosk and carry it home in jugs. There's no sewer, just an outhouse.\n\nIn winter, thousands of families burn coal in their stoves to stay warm, and the smoke gives Ulaanbaatar some of the most polluted air on Earth. Your little sister starts coughing in December.\n\nYou need work now.",c:[["Take a construction job","ubwork"],["Rent a stall at the giant outdoor market","ubmarket"]]},
ubwork:{t:"Construction is booming in Ulaanbaatar, with new apartment towers everywhere. You carry cement and rebar 12 hours a day. Work stops when the ground freezes in October.\n\nAt the end of the season, the contractor says he can't pay your last two months of wages. Your crew is furious. Some men want to go to the labor office. Others say it's pointless.\n\nThe city is struggling with so many newcomers. In 2017, Ulaanbaatar will temporarily stop letting people from the countryside register as new residents.",c:[["File a complaint at the labor office","labor"],["Give up on construction and try the market","ubmarket"],["Go back to herding with your uncle","endBackHerd"]]},
labor:{t:"The labor office takes your complaint. Three months later, you get half of what you were owed. It's not fair, but it's something.\n\nA man at the office mentions that South Korea hires Mongolian workers legally through a government program, and the pay is much higher than anything in Mongolia.",c:[["Stay in Ulaanbaatar and keep looking for work","endUB"],["Apply for the South Korea program","korea"]]},
ubmarket:{t:"You rent a stall at Narantuul, a huge outdoor market where people sell everything from boots to car parts. You buy phone cases and winter gloves wholesale from Chinese traders and sell them for a small profit.\n\nThe woman at the next stall worked in South Korea for four years. She says the South Korean government runs a program that hires workers from Mongolia and other Asian countries for factory jobs. You have to pass a Korean language test.",c:[["Stay in the city and grow your business","endUB"],["Study Korean and apply","korea"]]},
mine:{t:"Your cousin gets you hired as a driver-in-training at Oyu Tolgoi, a huge new copper and gold mine in the South Gobi Desert. The mining company pays more than you've ever earned. You live in a work camp, two weeks on and two weeks off.\n\nThe government is counting on mining to grow Mongolia's economy. But local herders are angry. The mine uses huge amounts of water in a desert, and some herders say their wells are drying up. They're protesting at the gate. Some of them are people you grew up with.",c:[["Keep working and save for an apartment","endMine"],["Quit and apply for higher-paying work in South Korea","korea"]]},
korea:{t:"You pass the Korean language test on your second try. South Korea's Employment Permit System lets you work there for up to about five years. You fly to Seoul and are sent to an auto parts factory in Ansan.\n\nThe work is fast and loud, and the shifts are 12 hours. You send home almost all of your pay. You video-call your mother every Sunday.\n\nAfter four years and ten months, your permit is about to expire. Your boss says you're his best worker and suggests you just stay. Thousands of workers overstay their permits.",c:[["Go home when your permit ends","endKorea"],["Stay in Korea after your permit expires","endOverstay"]]},
endHerd:{t:"It takes six years, but the herd grows back. Your mother and sisters live in the district center during the school year, and you and your father move with the animals between summer and winter pastures. The cooperative keeps hay stored for the next bad winter.",e:{k:"good",h:"Back on the steppe"}},
endAimag:{t:"You get promoted to warehouse manager. Your sisters graduate from a good school. In summer you visit relatives who still herd animals. You moved from the countryside to a small town, not all the way to the capital.",e:{k:"good",h:"Town life"}},
endUB:{t:"Your siblings go to school in the city and don't want to go back. Your father misses the steppe. Today about half of all Mongolians live in Ulaanbaatar, and many of them came from the countryside the same way you did.",e:{k:"mixed",h:"City of gers"}},
endBackHerd:{t:"After a year of smog and unpaid wages, you borrow animals from your uncle and go back to the countryside. Some families try the city and decide it isn't for them. You'll rebuild slowly.",e:{k:"mixed",h:"Return to the steppe"}},
endMine:{t:"You buy a small apartment in Dalanzadgad, the provincial center, and your family moves in. You never left Mongolia, but you went from herder to miner to town dweller in a few years.",e:{k:"good",h:"From herder to driver"}},
endKorea:{t:"You come home with enough savings to buy an apartment in Ulaanbaatar and open a small car repair shop. You still message friends in Korea, and you help your little brother study for the language test.",e:{k:"good",h:"Ansan and back"}},
endOverstay:{t:"You keep working without legal status. The pay is good, but you can't fly home, because if you leave you can't come back. Your sisters grow up seeing you only on a phone screen.",e:{k:"mixed",h:"Can't go home"}}
}},
{id:"priya",name:"Priya Nair",from:"Kerala, India",to:"Bengaluru, the Gulf, UK or Canada",year:"2012",blurb:"A new nurse has a diploma, a family loan, and few jobs at home.",start:"start",nodes:{
start:{t:"Kottayam, Kerala, India, 2012. You just finished nursing school. Your father drives an auto-rickshaw, and your family took out a loan of 4 lakh rupees (about $7,500 at the time) to pay for your education. The private hospital in town offers you 6,000 rupees a month, barely enough to cover the loan payment. Last year, nurses across Kerala went on strike for higher wages.\n\nAlmost every family on your street has someone “in the Gulf,” meaning the oil-rich Persian Gulf countries like the UAE and Saudi Arabia. Money they send home built most of the big houses in town.\n\nYour mother doesn't want you to go so far. Your father keeps the loan papers in a drawer and checks them every night.",c:[["Apply through a government-approved recruiting agency for a Gulf hospital job","legit"],["Use an agent your neighbor knows. He's faster and charges less","agent"],["Move to Bengaluru, a big city in another Indian state, for a better hospital job","blr"]]},
blr:{t:"Bengaluru is a booming tech city 800 kilometers from home. A big private hospital offers you twice what you'd earn in Kerala.\n\nThere's a catch. The hospital wants you to sign a two-year “bond.” They'll keep your original nursing certificates until you finish two years, and if you quit early you must pay a heavy penalty. Many Indian hospitals do this, even though nurses' groups say it's unfair.\n\nYou don't speak Kannada, the local language, and rent is expensive.",c:[["Sign the bond","blrBond"],["Refuse and apply for Gulf jobs instead","legit"]]},
blrBond:{t:"You work long night shifts and share a room with three other nurses from Kerala. Patients speak Kannada, Hindi, Tamil, and English, and you learn enough of each to get by. After two years, you get your certificates back.\n\nYou're earning more, but the loan isn't paid off yet. Recruiters say your two years of experience make you a strong candidate for the Gulf.",c:[["Stay in Bengaluru and build your career","endBlr"],["Use your experience to apply for Gulf jobs","legit"]]},
agent:{t:"The agent takes 1 lakh rupees and gets you a visa in just three weeks. At the Dubai airport you discover the visa is for a housemaid, not a nurse.\n\nYour employer takes your passport, which is illegal in the UAE, but it happens all the time. You cook, clean, and care for three children 16 hours a day. You're not allowed to leave the house alone. At this time, UAE labor law doesn't cover domestic workers.\n\nOne night, you see the employer's phone on the kitchen counter.",c:[["Run to the Indian consulate's shelter","shelter"],["Use the phone to message your family for help","family"],["Keep working and hope things improve","endTrapped"]]},
family:{t:"Your brother calls a Kerala government office that helps overseas workers, called NORKA. They contact the Indian embassy, which contacts your employer. Your employer is furious, but now officials know where you are.\n\nTwo weeks later, your employer drops you at the airport with your passport and a one-way ticket. You're home, but the agent's fee is gone.",c:[["Try again, through an approved agency this time","legit"],["Stay in Kerala","endKerala"]]},
shelter:{t:"You climb out a window at 4 a.m. and take a taxi to the Indian consulate, which runs a shelter for workers in trouble. Thirty women are there with stories like yours.\n\nIt takes four months, but officials pressure your employer to return your passport, and you fly home safely.",c:[["Try again, through an approved agency this time","legit"],["Stay in Kerala","endKerala"]]},
legit:{t:"The approved agency costs more, and you have to pass a licensing exam for the country where you'll work. You fail the first time by three points. You study for two more months and pass.\n\nThe agency offers two hospital jobs. In both countries, your work visa is tied to your employer, called your sponsor, under the kafala system. You can't easily change jobs without their permission.",c:[["Take the higher-paying job in Riyadh, Saudi Arabia","saudi"],["Take the job in Abu Dhabi, UAE","hospital"]]},
saudi:{t:"The pay in Riyadh is excellent, and the hospital provides housing and a bus to work. But Saudi Arabia is pushing companies to hire more Saudi citizens under a program called Nitaqat. In 2013, the government cracks down on foreign workers without proper papers, and hundreds of thousands are deported.\n\nYour papers are fine, but your hospital tells foreign nurses that some contracts won't be renewed.",c:[["Move to a hospital job in the UAE","hospital"],["Go home to Kerala with your savings","endKerala"]]},
hospital:{t:"In Abu Dhabi you earn about three times what you made at home. You share a flat with four nurses from Kerala and the Philippines. Every month you send most of your salary home, and the loan shrinks. You video-call your parents every night.\n\nAfter three years, recruiters start messaging you. Britain's National Health Service (NHS) is short of nurses and hiring from overseas. Canada has a points system that rewards nurses with experience. You could also just stay, since the money is good and Kerala is a four-hour flight away.",c:[["Stay in the Gulf for the long term","gulfLong"],["Apply to work for the NHS in the UK","uk"],["Apply to immigrate to Canada","canada"]]},
gulfLong:{t:"The loan is paid off. You help your parents build a new house in Kottayam and pay your brother's college fees. But you can never become a UAE citizen, and your visa lasts only as long as your job.\n\nIn 2020 COVID-19 hits. Your hospital is overwhelmed, and you work 14-hour shifts in full protective gear. India launches special flights to bring overseas workers home. Your mother begs you to come back.",c:[["Stay and keep working","endGulf"],["Take a flight home","endKerala"]]},
uk:{t:"You pass the English test and a nursing exam, then fly to England for a practical test. The NHS recruiter says your flight and first month of rent are free.\n\nBut there's a clause in the contract. If you leave in the first three years, you must repay thousands of pounds. Some nurses' groups say these repayment clauses trap overseas nurses.",c:[["Sign the contract","endUK"],["Turn it down and apply to Canada instead","canada"]]},
canada:{t:"Canada's Express Entry system gives you points for your age, education, English, and work experience. You also need to pass Canada's nursing exam and get your Indian diploma assessed. That takes a year and costs about $5,000.\n\nYour application is approved, but there's no job offer waiting. You'd be starting over in a cold country where you know no one.",c:[["Go to Canada anyway","endCanada"],["Stay in the Gulf where you have a job","endGulf"]]},
endBlr:{t:"You become a head nurse in Bengaluru and visit Kerala at festival time. Your migration stayed inside India, from a small town to a big city. You pay off the loan in five years.",e:{k:"good",h:"Big-city nurse"}},
endTrapped:{t:"Your employer withholds your pay for months. When your visa expires, you're arrested for overstaying and deported. You go home owing more money than when you left.",e:{k:"hard",h:"Trapped"}},
endKerala:{t:"You take a job at a local clinic. You earn far less, but you're home with your parents. Many Gulf workers return to Kerala eventually, and their savings and skills change the state.",e:{k:"mixed",h:"Back in Kerala"}},
endGulf:{t:"You stay in the Gulf for 15 years. You build a house in Kerala that you live in only one month a year. Your life is split between two countries, and you're not fully part of either.",e:{k:"mixed",h:"Living in two places"}},
endUK:{t:"You move to Leeds and start at an NHS hospital. After five years you can apply to settle permanently. You went from Kerala to Abu Dhabi to England, one step at a time, and now a younger cousin is studying for the same English test.",e:{k:"good",h:"Kerala to Abu Dhabi to Leeds"}},
endCanada:{t:"You land in Toronto as a permanent resident. You work as a personal support worker for six months until your nursing license comes through. In three more years, you can become a Canadian citizen.",e:{k:"good",h:"Permanent in Toronto"}}
}},
{id:"amal",name:"Amal Haddad",from:"Homs, Syria",to:"Jordan, Lebanon, Turkey, Europe or Canada",year:"2012",blurb:"A mother of two watches war arrive on her street.",start:"start",nodes:{
start:{t:"Homs, Syria, February 2012. You're a 34-year-old English teacher. Your husband Karim runs a small electronics shop. Your daughter Yara is 9 and your son Omar is 5.\n\nSyria's civil war began last year, when the government cracked down on protests. Now government forces are shelling your neighborhood. The power is out, the bakery is closed, and Yara's school was hit last week. You hear explosions every night.\n\nKarim says you have to leave today. You can each carry one bag.",c:[["Go to your aunt's village outside the city, still inside Syria","village"],["Cross the border into Lebanon","lebanon"],["Cross the border into Jordan","jordan"]]},
village:{t:"Your aunt's village is quiet at first. Fifteen people share her four-room house. You're now one of millions of Syrians displaced inside their own country.\n\nTo travel anywhere, you have to pass through army checkpoints. Soldiers check men's IDs, and young men are being pulled out of cars and forced into the army. Karim stops leaving the house.\n\nA year later, fighting reaches the village.",c:[["Stay and hope the fighting passes","endIDP"],["Cross into Lebanon","lebanon"],["Cross into Jordan","jordan"]]},
jordan:{t:"You cross into Jordan at night through the desert. Jordanian soldiers bring you to Zaatari, a refugee camp that will grow to about 80,000 people, among the largest in the world. You get a tent, blankets, and food vouchers. Dust storms blow sand into everything.\n\nAfter a year, you get a metal trailer instead of a tent. UN agencies run schools, but Yara's class has 50 kids.\n\nYou can only leave the camp legally if a Jordanian citizen sponsors you. A man Karim knows offers to do it, for a fee.",c:[["Stay in the camp","zaatari"],["Pay to leave the camp and move to the city of Irbid","irbid"]]},
zaatari:{t:"Life in the camp settles into a routine. A main street of shops, nicknamed the Champs-Élysées, sells falafel, wedding dresses, and phones. You teach English to kids in a tent school.\n\nIn 2016 Jordan agrees with the EU and World Bank to give Syrians work permits in exchange for aid and trade deals. Karim gets a permit to work on a farm.\n\nThe UN refugee agency asks if you'd like to be considered for resettlement to another country.",c:[["Stay in Jordan","endJordan"],["Apply for resettlement","resettle"]]},
irbid:{t:"You rent two rooms in Irbid. Without a work permit, Karim takes cash jobs painting apartments. If police catch him working illegally, he could be sent back to the camp, or even to Syria.\n\nRent eats most of your savings. Yara is in a Jordanian school that runs a second shift in the afternoon just for Syrian kids.",c:[["Stay in Irbid and get by","endJordan"],["Apply through the UN for resettlement","resettle"]]},
lebanon:{t:"You cross into Lebanon and register with the UN refugee agency, UNHCR. More than a million Syrians arrive in Lebanon, a country of about 5 million. Lebanon doesn't allow official refugee camps, so you rent a room in an unfinished building in the Bekaa Valley. Karim works on construction sites without a permit.\n\nIn 2015 Lebanon starts charging Syrians $200 per adult every year to renew their residency. You can't afford it for both of you. Yara, now 12, could earn money picking potatoes on a farm instead of going to school.",c:[["Keep Yara in school and apply for resettlement","resettle"],["Send Yara to work so you can pay the fees, and stay in Lebanon","endLebanon"],["Go to Turkey and try to reach Europe","turkey"]]},
resettle:{t:"UNHCR interviews you three times over two years. They ask the same questions each time to check that your story stays the same. Fewer than 1 percent of the world's refugees are ever resettled to a new country.\n\nIn late 2015, Canada promises to resettle 25,000 Syrians in four months. Around the same time, the U.S. also accepts your file. Karim's cousin lives in Chicago.",c:[["Go to Canada, which promises fast processing","endCanada"],["Go to the U.S. to be near Karim's cousin","usa"]]},
usa:{t:"U.S. security checks for refugees take about two years: interviews, fingerprints, medical tests. You wait in Lebanon while they're processed.\n\nIn January 2017, a new presidential order pauses refugee admissions and bans travel from Syria. Your flight, scheduled for next month, is canceled. No one can tell you when it will be rescheduled.",c:[["Keep waiting for the U.S.","endUSWait"],["Ask UNHCR to move your case to Canada","endCanada"]]},
turkey:{t:"Turkey hosts more Syrian refugees than any other country, more than 3 million. In the coastal city of Izmir, every hotel lobby is full of Syrians, and every shop sells life jackets, some of them fake. Smugglers charge $1,200 a person for a seat on a rubber boat to the Greek island of Lesbos, about 10 kilometers away. It's 2015, and nearly a million people make similar crossings this year.\n\nThe sea is rough tonight. The smuggler says the boat goes now or not at all. Another family is sending only the father ahead, so he can apply for asylum and then bring his family to Europe legally later.",c:[["Get in the boat tonight, all four of you","rough"],["Send Karim ahead alone so he can bring the family legally later","karimAhead"],["Stay and work in Turkey","endTurkey"]]},
rough:{t:"The rubber boat holds 50 people and was built for 20. Halfway across, the motor cuts out and waves pour over the sides. Omar is screaming. Someone is praying.\n\nA Greek coast guard boat reaches you just in time. You're pulled aboard soaked and freezing, but alive. Your bag with your passports and Yara's school certificates is at the bottom of the sea.\n\nOn Lesbos, volunteers hand you dry clothes. Officials register you with whatever information you can tell them.",c:[["Keep heading north toward Germany or Sweden","balkans"],["Apply for asylum in Greece","endGreece"]]},
karimAhead:{t:"Karim makes it to Germany in six weeks and applies for asylum. You and the kids wait in a small apartment in Istanbul.\n\nIn 2016, Germany gives many Syrians a lesser kind of protection and suspends family reunification for that group for two years. Karim's case falls into that group. He can stay in Germany, but he can't bring you.\n\nYou haven't seen him in a year. Omar is starting to forget what he looks like.",c:[["Wait for family reunification to reopen","endReunite"],["Take the boat with the kids yourself","rough"]]},
balkans:{t:"From Lesbos you take a ferry to Athens, then head north by bus, train, and on foot through North Macedonia and Serbia, with thousands of others. In September 2015, Hungary closes its border with a razor-wire fence, so the route shifts west through Croatia and Slovenia.\n\nBy October you reach Austria. Volunteers at a train station hand out bananas and SIM cards. Everyone is talking about where to go next.",c:[["Go to Germany","germany"],["Go to Sweden, which offers Syrians permanent residence","endSweden"]]},
germany:{t:"Germany has agreed to hear asylum claims from Syrians even if they passed through other EU countries first, setting aside an EU rule that normally sends asylum seekers back to the first EU country they entered. Crowds at Munich's train station cheer arrivals. Germany receives about 890,000 asylum seekers in 2015.\n\nYou spend four months sleeping in a gym with 200 other people, waiting for your asylum interview. When it comes, you tell your story. Your case depends on whether the officer believes you.",c:[["Wait for the decision","endGermany"],["Give up on Germany and move on to Sweden","endSweden"]]},
endIDP:{t:"Your family moves four more times within Syria over the next decade, staying with relatives, in schools, and finally in a camp near the Turkish border. You never become a refugee, but you can't go home either.",e:{k:"hard",h:"Displaced at home"}},
endJordan:{t:"Years pass in Jordan. You're safe, the kids are in school, and Karim has some work. But you can't build a permanent life here, and Homs is still too dangerous. Ten years later, you're still waiting to go home.",e:{k:"mixed",h:"Waiting in Jordan"}},
endLebanon:{t:"In 2019, Lebanon's economy collapses, and its currency loses almost all its value. Some Lebanese politicians blame Syrians and pressure them to leave. Yara never goes back to school. Your family is safe from bombs, but you can barely afford food.",e:{k:"hard",h:"Safe but struggling"}},
endCanada:{t:"You land in Toronto in January. A group of Canadian neighbors who raised money to sponsor your family meets you at the airport with winter coats. They help you find an apartment, enroll the kids in school, and sign you up for teacher certification.\n\nAs resettled refugees, your family has permanent residence from the day you arrive.",e:{k:"good",h:"Welcome to Canada"}},
endUSWait:{t:"Two more years pass in Lebanon. U.S. refugee admissions drop to record lows. Your file is still open, but nobody can tell you when, or if, you'll ever travel.",e:{k:"hard",h:"Still waiting"}},
endTurkey:{t:"You find work at a textile workshop in Istanbul, and Karim drives a delivery van. Turkey gives Syrians “temporary protection,” which allows school and health care but isn't permanent. Over time, some Turks grow tired of hosting so many refugees, and politicians start promising to send Syrians home.",e:{k:"mixed",h:"Safe, but temporary"}},
endGreece:{t:"In March 2016 the EU signs a deal with Turkey to stop the boats, and the countries north of Greece close their borders. You spend two years in a crowded camp on Lesbos while your asylum claim slowly moves forward. Without documents, every step takes longer.",e:{k:"hard",h:"Stuck in Greece"}},
endReunite:{t:"In 2018 Germany reopens family reunification, but only for 1,000 people a month. Your turn comes 14 months later. You fly to Germany on a visa, legally and safely. Omar hides behind your legs when he sees his father.",e:{k:"mixed",h:"Reunited"}},
endSweden:{t:"Sweden grants you permanent residence. Weeks after you arrive, Sweden, overwhelmed by arrivals, brings back border checks and switches to temporary permits. You got in just before the change. The kids learn Swedish in a year.",e:{k:"good",h:"Just in time"}},
endGermany:{t:"You're officially recognized as a refugee. You take German classes, and the kids pick up the language faster than you. You're starting over at 37, but you're safe, and you're together.\n\nIn 2016 the EU signs a deal with Turkey to stop the boats, and the route you took mostly closes behind you.",e:{k:"good",h:"Asylum in Germany"}}
}}
];

const app=document.getElementById("app");
const TERMS=[
["Why people move",[["Push factor","Something that makes people want to leave a place, such as war, poverty, or drought."],["Pull factor","Something that attracts people to a new place, such as jobs, safety, or family."]]],
["Along the way",[["Intervening opportunity","A positive alternative that comes up during the journey and may change where the migrant ends up."],["Intervening obstacle","A roadblock that slows or stops the journey. It can be cultural, demographic, economic, environmental, or political."]]],
["Forced migration",[["Refugee","A person forced to flee their country because of war, violence, or persecution who cannot safely return."],["Internally displaced person (IDP)","A person forced to flee their home who stays inside their own country."],["Asylum seeker","A person who has fled to another country and asked for protection, but whose case has not been decided yet."]]],
["Voluntary migration",[["Transnational migration","Living a life connected to two countries, such as working in one and sending money and visits to the other."],["Transhumance","Herders moving with their animals between seasonal pastures."],["Internal migration","Moving to a new place within the same country."],["Chain migration","Moving to join family or friends who migrated earlier."],["Step migration","Reaching a final destination in a series of smaller moves."],["Guest worker","A person allowed to work in another country temporarily."],["Rural-to-urban migration","Moving from the countryside to a city."]]],
["Political effects",[["Government response","Laws, quotas, permits, border controls, deportations, and welcome programs that governments create in response to migrants."]]]];
let cur=null; // {s, node, hist:[], log:[], seen:Set}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let endingsFound=store.get("ij-endings")||{};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const endingsOf=s=>Object.keys(s.nodes).filter(k=>s.nodes[k].e);

function renderHome(){
  cur=null;
  app.innerHTML=`<div class="intro"><h2>Choose your immigrant</h2><p>Write their name at the top of your worksheet.</p></div>
  <div class="grid">${STORIES.map(s=>{const ends=endingsOf(s),got=endingsFound[s.id]||[];
    return `<button class="card" data-id="${s.id}"><span class="year">${s.year}</span><h3>${esc(s.name)}</h3>
    <div class="route">${esc(s.from)} <span>→</span> ${esc(s.to)}</div><p>${esc(s.blurb)}</p>
    <div class="found"><span class="dots">${ends.map(k=>`<i class="${got.includes(k)?"on":""}"></i>`).join("")}</span>${got.length} of ${ends.length} endings found</div></button>`}).join("")}</div>
  <p class="teacher">The people in these stories are fictional, but the events, laws, and conditions around them are real. Each journey takes about 10–15 minutes and has several endings. After you finish one, go back and make different choices to find more evidence for your notes.</p>`;
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>start(b.dataset.id));
  window.scrollTo(0,0);
}
function start(id){const s=STORIES.find(x=>x.id===id);cur={s,node:s.start,hist:[],log:[],seen:new Set([s.start])};renderStory();window.scrollTo(0,0)}
function go(to,label){cur.hist.push({node:cur.node,log:cur.log.length});cur.log.push(label);cur.node=to;cur.seen.add(to);
  const n=cur.s.nodes[to];if(n.e){const a=endingsFound[cur.s.id]||[];if(!a.includes(to)){a.push(to);endingsFound[cur.s.id]=a;store.set("ij-endings",endingsFound)}}
  renderStory();document.getElementById("passage").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})}
function back(){const h=cur.hist.pop();if(!h)return;cur.node=h.node;cur.log.length=h.log;renderStory()}
function restart(){cur.hist=[];cur.log=[];cur.node=cur.s.start;renderStory()}

function renderStory(){
  const s=cur.s,n=s.nodes[cur.node];
  const chips="";
  const ends=endingsOf(s),got=endingsFound[s.id]||[];
  let body;
  if(n.e){const label={good:"Arrived",mixed:"Still in limbo",hard:"Journey cut short"}[n.e.k];
    body=`${n.t.split(/\n\n/).map(p=>`<p>${esc(p)}</p>`).join("")}${chips}<div class="ending"><span class="stamp ${n.e.k}">${label}</span><h3>${esc(n.e.h)}</h3>
    <p class="nudge">You've found ${got.length} of ${ends.length} endings for ${esc(s.name.split(" ")[0])}. Go back and make different choices to find more evidence for your notes.</p>
    <div class="choices"><button class="choice" id="b-back">Go back one step</button><button class="choice" id="b-restart">Start this journey over</button><button class="choice" id="b-home">Choose another immigrant</button></div></div>`}
  else body=`${n.t.split(/\n\n/).map(p=>`<p>${esc(p)}</p>`).join("")}${chips}<div class="choices">${n.c.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c[0])}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="top"><button class="btn" id="t-home">← All immigrants</button><button class="btn" id="t-back" ${cur.hist.length?"":"disabled"}>Undo last choice</button><button class="btn" id="t-restart">Start over</button></div>
  <div class="story"><div style="min-width:0"><div class="who">Your immigrant</div><h2>${esc(s.name)}</h2>
  <div class="route">${esc(s.from)} <span>→</span> ${esc(s.to)}</div>
  <section class="passage" id="passage" tabindex="-1"><div class="step">Step ${cur.hist.length+1}</div>${body}</section></div>
  <aside><div class="panel"><h4>Your choices</h4>${cur.log.length?`<ol class="log">${cur.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ol>`:`<p class="small" style="margin:0">None yet. Read the scene and pick a path.</p>`}</div>
  <div class="panel"><h4>Worksheet key terms</h4><div class="terms">${TERMS.map(([g,list])=>`<div><h5>${g}</h5><dl>${list.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl></div>`).join("")}</div></div></aside></div>`;
  app.querySelectorAll(".choice[data-i]").forEach(b=>b.onclick=()=>{const c=n.c[+b.dataset.i];go(c[1],c[0])});
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on("t-home",renderHome);on("t-back",back);on("t-restart",restart);on("b-back",back);on("b-restart",restart);on("b-home",renderHome);
}
renderHome();
</script>
</body></html>
